<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Kasi Vishwanathan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/icons8-k-100.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0d0d0d;
      --cream: #e8e0ce;
      --gold: #e4dbc9;
      --cta-gold: #c8a96e;
      --display: 'Bebas Neue', Impact, sans-serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: #050505;
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 560px;
    }

    .four-oh-four {
      font-family: var(--display);
      font-size: clamp(120px, 22vw, 220px);
      line-height: 0.85;
      color: transparent;
      -webkit-text-stroke: 1px rgba(232, 224, 206, 0.18);
      letter-spacing: 0.04em;
      user-select: none;
    }

    h1 {
      font-family: var(--sans);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 400;
      color: rgba(232, 224, 206, 0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 1.5rem;
      margin-bottom: 2.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      border: 1px solid rgba(200, 169, 110, 0.35);
      border-radius: 100px;
      color: var(--cta-gold);
      font-family: var(--sans);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .back-link:hover {
      background: rgba(200, 169, 110, 0.08);
      border-color: var(--cta-gold);
      color: var(--cream);
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="container">
    <div class="four-oh-four" aria-hidden="true">404</div>
    <h1>Page not found</h1>
    <a href="/" class="back-link">← Back to portfolio</a>
  </div>
</body>
</html>
